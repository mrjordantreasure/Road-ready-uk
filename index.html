<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF‑8">
  <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
  <title>RoadReady UK</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box‑sizing: border‑box;
    }

    body {
      background‑image: url("roadready‑hero‑bg.jpg");
      background‑size: cover;
      background‑position: center;
      background‑repeat: no‑repeat;
      background‑attachment: fixed;
      width: 100%;
      min‑height: 100vh;
      overflow‑x: hidden;
      font‑family: Arial, sans‑serif;
    }

    .hero‑links {
      display: flex;
      justify‑content: center;
      gap: 10px;
      flex‑wrap: wrap;
      margin‑top: 50vh;
    }

    .hero‑btn {
      width: 110px;
      height: 110px;
      border‑radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      font‑size: 14px;
      cursor: pointer;
    }

    .hero‑btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    @media (max‑width: 768px) {
      .hero‑links {
        margin‑top: 48vh;
        gap: 6px;
      }
      .hero‑btn {
        width: 75px;
        height: 75px;
        font‑size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="hero‑links">
    <a href="mock‑test.html"><button class="hero‑btn">Mock Test</button></a>
    <a href="lessons.html"><button class="hero‑btn">Lessons</button></a>
    <a href="progress.html"><button class="hero‑btn">Progress</button></a>
    <a href="safety.html"><button class="hero‑btn">Safety</button></a>
    <a href="hazard.html"><button class="hero‑btn">Hazards</button></a>
  </div>

  <!-- Firebase login / page protection script (DO NOT REMOVE) -->

</body>
</html>
